name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JS dev dependencies
        run: |
          npm ci

      - name: Validate Aegis evidence matrix
        run: |
          python -m antinode_aegis.evidence docs/adr/evidence-matrix.yml

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check unused imports with Ruff
        run: |
          python -m ruff check . --select F401

      - name: Lint with Ruff
        run: |
          python -m ruff check antinode_norma/ tests/ --select E9,F63,F7,F82 --statistics
          python -m ruff check antinode_norma/ tests/ --exit-zero --line-length 127 --statistics

      - name: Run unit tests (no integration)
        run: |
          pytest -m "not integration" --cov=antinode_norma --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push' && matrix.python-version == '3.11'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Install Playwright browser
        run: npx --prefix ui playwright install --with-deps chromium

      - name: Lint UI
        run: npm --prefix ui run lint

      - name: Typecheck UI
        run: npm --prefix ui run typecheck

      - name: Run UI unit tests
        run: npm --prefix ui run test

      - name: Run UI functional and accessibility tests
        run: npm --prefix ui run test:e2e:quality

      - name: Build UI
        run: npm --prefix ui run build

  codegen:
    name: Codegen validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install JS dev dependencies
        run: |
          npm ci

      - name: Validate feature generation
        run: |
          mkdir -p generated_tests_ci
          for f in features/login.feature features/reset_my_password.feature; do
            python -m antinode_norma.codegen.cli.commands generate -f "$f" -o generated_tests_ci -fw playwright
          done

  evaluation:
    name: Evaluation and cost gates
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run deterministic evaluation gates
        run: |
          pytest tests/unit/test_eval_harness_p5_t04.py tests/unit/test_exact_cache_p5_t01.py tests/unit/test_wire_cache_p5_t02.py tests/unit/test_semantic_cache_p5_t03.py tests/unit/test_cost_tracker_p5_t05.py -q --no-cov

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest -m "integration or external_integration" --cov=antinode_norma --cov-report=xml --cov-report=term

      - name: Upload coverage (integration) to Codecov
        if: env.OPENROUTER_API_KEY != '' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
