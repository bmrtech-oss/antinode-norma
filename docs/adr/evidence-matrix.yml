      - antinode_aegis/evidence.py
    test_paths:
      - tests/unit/test_aegis_evidence.py
    surfaces:
      ui:
        status: not_applicable
        route_or_component: Evidence-matrix validation is not a UI capability
        test_paths: []
      api:
        status: not_applicable
        endpoint_or_schema: Evidence-matrix validation is not an API capability
        test_paths: []
      cli:
        status: supported
        command: python -m antinode_aegis.evidence
        test_paths:
          - tests/unit/test_aegis_evidence.py
      mcp:
        status: not_applicable
        tool_or_resource: Evidence-matrix validation is not an MCP capability
        test_paths: []
    command: python -m pytest tests/unit/test_aegis_evidence.py --no-cov -q
    expected_result: Evidence matrix schema, paths, statuses, and surface records validate successfully
    artifact_path: docs/adr/evidence/AEGIS-0-validation.md
    status: implemented
    last_verified: "2026-09-23"

