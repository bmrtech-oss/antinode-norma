  - requirement_id: AEGIS-P0-SECRETS
    release_profile: aegis-foundation
    phase: P0
    task_id: P0-T01
    owner: security-lead
    code_paths:
      - docs/SECRETS.md
      - .env.example
      - .gitignore
      - .github/workflows/ci.yml
    test_paths:
      - tests/unit/test_aegis_p0_secrets.py
    surfaces:
      ui:
        status: not_applicable
        route_or_component: Secret handling is an infrastructure and CI control
        test_paths: []
      api:
        status: not_applicable
        endpoint_or_schema: Secret handling is not exposed as an API operation
        test_paths: []
      cli:
        status: supported
        command: Provider-specific CLI operations fail explicitly when required keys are missing
        test_paths: []
      mcp:
        status: not_applicable
        tool_or_resource: Secrets are not exposed to MCP tools
        test_paths: []
    command: python -m pytest tests/unit/test_aegis_p0_secrets.py --no-cov -q
    expected_result: Secret templates, Git exclusion, CI scanning, and fail-fast provider handling are documented and verified
    artifact_path: docs/adr/evidence/AEGIS-P0-secrets.md
    status: implemented
    last_verified: "2026-09-23"

